site_name: DataPorter
site_description: A mountable Rails engine for data import workflows
site_url: https://seryllns.github.io/data_porter
repo_url: https://github.com/SerylLns/data_porter
repo_name: SerylLns/data_porter
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/database-import
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - exclude:
      glob:
        - blog/*
        - blog_part_2/*
        - V1_PLAN.md
        - dev_to.md
        - reddit_post.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SerylLns/data_porter
    - icon: fontawesome/brands/dev
      link: https://dev.to/seryllns
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Reference:
      - Configuration: CONFIGURATION.md
      - Targets: TARGETS.md
      - Sources: SOURCES.md
      - Column Mapping: MAPPING.md
      - Views & Theming: VIEWS.md
      - Routes: routes.md
  - Roadmap: ROADMAP.md
  - Changelog: changelog.md
  - Contributing: contributing.md
